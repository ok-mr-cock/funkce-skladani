<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inverzní funkce</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#1a2233;--mut:#5b6579;--bd:#cdd5e4;--f:#1d4ed8;--inv:#d9381e;--ok:#15803d;--bad:#b42318;--grid:#dde4f0;--ax:#7c869b;--g:#16a34a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#edf0f7;--mut:#a1abc0;--bd:#2f3850;--f:#7aa2ff;--inv:#ff7d63;--ok:#4ade80;--bad:#ff8a80;--grid:#262e42;--ax:#7d879d;--g:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#edf0f7;--mut:#a1abc0;--bd:#2f3850;--f:#7aa2ff;--inv:#ff7d63;--ok:#4ade80;--bad:#ff8a80;--grid:#262e42;--ax:#7d879d;--g:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}
.lv{font:inherit;font-size:.72rem;line-height:1.25;padding:8px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;min-height:48px}
.lv b{display:block;font-size:1rem}
.lv[aria-pressed="true"]{border-color:var(--f);box-shadow:inset 0 0 0 1.5px var(--f);color:var(--f)}
.task{font:600 1.7rem/1.3 Cambria,"Cambria Math",Georgia,serif;color:var(--f);margin:2px 0 12px;overflow-wrap:anywhere}
.lab{color:var(--mut);font-size:.9rem;margin:0}
.row{display:flex;align-items:center;gap:8px}
.row span{font:600 1.15rem Cambria,Georgia,serif;color:var(--inv);white-space:nowrap}
input{flex:1;min-width:0;font:1.15rem Cambria,"Cambria Math",Georgia,serif;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus-visible,button:focus-visible{outline:2.5px solid var(--f);outline-offset:2px}
.keys{display:flex;gap:6px;margin:8px 0}
.keys button{flex:1;font:1.05rem Cambria,Georgia,serif;padding:8px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer;min-height:44px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;min-height:44px}
.acts .go{background:var(--f);border-color:var(--f);color:#fff;font-weight:600}
:root[data-theme="dark"] .acts .go{color:#0b1020}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .acts .go{color:#0b1020}}
#msg{min-height:1.5em;margin:10px 0 0;font-weight:500}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}#msg.info{color:var(--tx);font-weight:400}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:8px;background:var(--card)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.score{color:var(--mut);font-size:.9rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>Inverzní funkce</h1>
<p class="sub">Zapiš předpis funkce, která „vrací zpět“ zadanou funkci.</p>

<div class="levels" id="levels"></div>

<section class="card">
  <p class="lab">Najdi inverzní funkci k funkci</p>
  <div class="task" id="task"></div>
  <p class="lab" style="margin-bottom:6px">Tvoje odpověď</p>
  <div class="row"><span>f⁻¹: y =</span><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Předpis inverzní funkce" placeholder="např. 2x − 3"></div>
  <div class="keys" id="keys"></div>
  <div class="acts">
    <button class="go" id="bCheck">Zkontrolovat</button>
    <button id="bHint">Nápověda</button>
    <button id="bShow">Ukázat řešení</button>
    <button id="bNext">Další příklad</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
</section>

<section class="card">
  <canvas id="cv" role="img" aria-label="Graf funkce, její inverze a přímky y = x"></canvas>
  <div class="leg">
    <span><i style="border-color:var(--f)"></i>f</span>
    <span><i style="border-color:var(--inv)"></i>f⁻¹ (po vyřešení)</span>
    <span><i style="border-color:var(--g)"></i>tvoje odpověď</span>
    <span><i style="border-color:var(--ax);border-top-style:dashed"></i>y = x</span>
  </div>
</section>
<p class="score" id="score"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const M='−';
const n=v=>String(v).replace('-',M);
const sg=v=>v===0?'':(v>0?` + ${v}`:` ${M} ${-v}`);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const nz=(a,b)=>{let v;do v=ri(a,b);while(!v);return v};

/* Generátory příkladů: ft = zadání, it = správný předpis inverze, fmin/imin = dolní mez definičních oborů */
const GEN=[
 ()=>{const b=nz(-6,6);
  return Math.random()<.3
   ?{ft:`${M}x${sg(b)}`,f:x=>-x+b,inv:x=>-x+b,it:`${M}x${sg(b)}`}
   :{ft:`x${sg(b)}`,f:x=>x+b,inv:x=>x-b,it:`x${sg(-b)}`}},
 ()=>{if(Math.random()<.65){const a=pick([2,3,4,5,-2,-3,-4,-5]),b=nz(-6,6);
   return{ft:`${n(a)}x${sg(b)}`,f:x=>a*x+b,inv:x=>(x-b)/a,it:a>0?`(x${sg(-b)})/${a}`:`(${n(b)} ${M} x)/${-a}`}}
  const k=pick([2,3,4,5]),b=nz(-5,5);
  if(Math.random()<.5)return{ft:`${M}x/${k}${sg(b)}`,f:x=>-x/k+b,inv:x=>k*b-k*x,it:`${n(k*b)} ${M} ${k}x`};
  return{ft:`x/${k}${sg(b)}`,f:x=>x/k+b,inv:x=>k*x-k*b,it:`${k}x${sg(-k*b)}`}},
 ()=>{const[p,q]=pick([[2,3],[3,2],[3,4],[4,3],[2,5],[5,2],[3,5],[5,3]]),neg=Math.random()<.45,b=nz(-5,5),a=(neg?-p:p)/q;
  return{ft:`${neg?M:''}${p}x/${q}`+sg(b),f:x=>a*x+b,inv:x=>(x-b)/a,it:neg?`(${n(q*b)} ${M} ${q}x)/${p}`:`(${q}x${sg(-q*b)})/${p}`}},
 ()=>{const t=ri(0,2),c=nz(-4,4);
  if(t==0)return{ft:`√x${sg(c)}`,f:x=>Math.sqrt(x)+c,inv:x=>(x-c)**2,fmin:0,imin:c,it:`(x${sg(-c)})²`,note:`x ≥ ${n(c)}`};
  if(t==1)return{ft:`√(x${sg(c)})`,f:x=>Math.sqrt(x+c),inv:x=>x*x-c,fmin:-c,imin:0,it:`x²${sg(-c)}`,note:'x ≥ 0'};
  return{ft:'x², x ≥ 0',f:x=>x*x,inv:x=>Math.sqrt(x),fmin:0,imin:0,it:'√x',note:'x ≥ 0'}},
 ()=>{const c=nz(-4,4);
  if(Math.random()<.5){const a=pick([2,3]);
   return{ft:`${a}√x${sg(c)}`,f:x=>a*Math.sqrt(x)+c,inv:x=>((x-c)/a)**2,fmin:0,imin:c,it:`((x${sg(-c)})/${a})²`,note:`x ≥ ${n(c)}`}}
  const d=nz(-4,4);
  return{ft:`√(x${sg(c)})${sg(d)}`,f:x=>Math.sqrt(x+c)+d,inv:x=>(x-d)**2-c,fmin:-c,imin:d,it:`(x${sg(-d)})²${sg(-c)}`,note:`x ≥ ${n(d)}`}}
];
const NAMES=['Posun','Přímky','Zlomky','Odmocniny','Složitější'];

/* Parser zápisu: 2x-3, (x+1)/2, sqrt(x), √x, (x-2)^2, (x-2)² ... */
function parse(s){
 s=s.toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/√/g,'sqrt');
 if(s.includes('='))s=s.slice(s.lastIndexOf('=')+1);
 const t=s.match(/\d*\.?\d+|\d+\.|sqrt|x|[-+*\/^()]/g)||[];
 if(!t.length||t.join('')!==s)throw 0;
 let i=0;
 const st=()=>i<t.length&&(/^[\dx.]/.test(t[i])||t[i]=='('||t[i]=='sqrt');
 function E(){let v=T();while(t[i]=='+'||t[i]=='-'){const o=t[i++],r=T(),l=v;v=o=='+'?x=>l(x)+r(x):x=>l(x)-r(x)}return v}
 function T(){let v=U();for(;;){const o=t[i];
  if(o=='*'||o=='/'){i++;const r=U(),l=v;v=o=='*'?x=>l(x)*r(x):x=>l(x)/r(x)}
  else if(st()){const r=P(),l=v;v=x=>l(x)*r(x)}
  else return v}}
 function U(){if(t[i]=='-'){i++;const r=U();return x=>-r(x)}if(t[i]=='+'){i++;return U()}return P()}
 function P(){const b=A();if(t[i]=='^'){i++;const e=U();return x=>Math.pow(b(x),e(x))}return b}
 function A(){const k=t[i++];if(k===undefined)throw 0;
  if(k=='x')return x=>x;
  if(/^[\d.]/.test(k)){const v=parseFloat(k);return()=>v}
  if(k=='('){const v=E();if(t[i++]!=')')throw 0;return v}
  if(k=='sqrt'){const r=A();return x=>Math.sqrt(r(x))}
  throw 0}
 const g=E();if(i!=t.length)throw 0;return g;
}

const S={lvl:0,task:null,revealed:false,attempt:null,ok:0,streak:0};

function newTask(){
 S.task=GEN[S.lvl]();S.revealed=false;S.attempt=null;
 $('task').textContent='f: y = '+S.task.ft;
 $('ans').value='';$('msg').className='';$('msg').textContent='';
 draw();
}
function say(txt,cls){const m=$('msg');m.textContent=txt;m.className=cls||''}
function reveal(){S.revealed=true;draw()}

function check(){
 const t=S.task;let g;
 try{g=parse($('ans').value)}catch(e){say('Tomuto zápisu nerozumím. Použij x, + − * /, závorky, √( ) a mocniny (např. (x − 2)²).','bad');return}
 const xs=t.imin==null?[-5,-3,-1.5,-.5,.5,1,2.5,4,6.5]:[0,.25,1,2,3.5,5,7.5].map(v=>t.imin+v);
 const ok=xs.every(x=>{const a=g(x),b=t.inv(x);return isFinite(a)&&Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b))});
 if(ok){
  if(!S.revealed){S.ok++;S.streak++}S.attempt=g;
  reveal();
  say('Správně! f⁻¹: y = '+t.it+(t.note?'   (definiční obor: '+t.note+')':''),'ok');
 }else{
  S.streak=0;S.attempt=g;draw();
  say('Zatím ne. Zelená čára je tvoje odpověď – není souměrná s funkcí f podle přímky y = x.','bad');
 }
 score();
}
function hint(){
 const t=S.task;
 let h=`1) Zaměň x a y: x = ${t.ft.replace(/x/g,'y')}.  2) Z rovnice vyjádři y.`;
 if(S.lvl==2)h+=' Zlomku se zbavíš vynásobením obou stran jmenovatelem.';if(S.lvl>=3)h+=' Odmocninu se zbavíš umocněním obou stran na druhou.';
 say(h,'info');
}
function show(){
 const t=S.task;S.streak=0;reveal();
 say('Řešení: f⁻¹: y = '+t.it+(t.note?'   (definiční obor: '+t.note+')':''),'info');score();
}
function score(){$('score').textContent=`Vyřešeno správně: ${S.ok}`+(S.streak>=3?` · série ${S.streak}`:'')+(S.ok>=5&&S.lvl<4?' · zkus vyšší úroveň':'')}

/* Graf */
const V=8;
function draw(){
 const cv=$('cv'),W=cv.getBoundingClientRect().width,d=window.devicePixelRatio||1;
 if(!W)return;
 cv.width=Math.round(W*d);cv.height=Math.round(W*d);
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim();
 const s=W/(2*V),X=x=>(x+V)*s,Y=y=>(V-y)*s;
 c.clearRect(0,0,W,W);
 c.lineWidth=1;c.strokeStyle=col('--grid');
 for(let k=-V;k<=V;k++){c.beginPath();c.moveTo(X(k),0);c.lineTo(X(k),W);c.moveTo(0,Y(k));c.lineTo(W,Y(k));c.stroke()}
 c.strokeStyle=col('--ax');c.lineWidth=1.5;c.beginPath();c.moveTo(X(0),0);c.lineTo(X(0),W);c.moveTo(0,Y(0));c.lineTo(W,Y(0));c.stroke();
 c.fillStyle=col('--ax');c.font='11px system-ui,sans-serif';c.textAlign='center';c.textBaseline='top';
 for(let k=-6;k<=6;k+=2){if(!k)continue;c.fillText(n(k),X(k),Y(0)+4)}
 c.textAlign='right';c.textBaseline='middle';
 for(let k=-6;k<=6;k+=2){if(!k)continue;c.fillText(n(k),X(0)-5,Y(k))}
 // y = x
 c.setLineDash([6,5]);c.strokeStyle=col('--ax');c.lineWidth=1.5;c.beginPath();c.moveTo(X(-V),Y(-V));c.lineTo(X(V),Y(V));c.stroke();c.setLineDash([]);
 c.fillStyle=col('--ax');c.textAlign='left';c.textBaseline='bottom';c.fillText('y = x',X(V)-38,Y(V)+30);
 const curve=(fn,lo,color,w)=>{
  c.beginPath();c.strokeStyle=color;c.lineWidth=w||2.8;c.setLineDash([]);let up=false;
  const x0=Math.max(lo==null?-V:lo,-V);
  for(let x=x0;x<=V+1e-9;x+=.01){const y=fn(x);
   if(!isFinite(y)||Math.abs(y)>40){up=false;continue}
   up?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));up=true}
  c.stroke();c.setLineDash([])};
 const t=S.task;
 
 curve(t.f,t.fmin,col('--f'));
 if(S.revealed)curve(t.inv,t.imin,col('--inv'),5.5);
 if(S.attempt)curve(S.attempt,null,col('--g'),2.6);
 if(S.revealed){
  
  // dvojice souměrných bodů
  const b=t.fmin==null?-6:t.fmin;
  const ps=[];for(let k=0;k<14;k++){const p=b+k*(t.fmin==null?1:.5+k*0.25);const q=t.f(p);if(isFinite(q)&&Math.abs(p)<=V-.5&&Math.abs(q)<=V-.5&&Math.abs(p-q)>.8)ps.push([p,q])}
  const use=ps.length>3?[ps[0],ps[Math.floor(ps.length/2)],ps[ps.length-1]]:ps;
  use.forEach(([p,q])=>{
   c.strokeStyle=col('--ax');c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(X(p),Y(q));c.lineTo(X(q),Y(p));c.stroke();c.setLineDash([]);
   c.fillStyle=col('--f');c.beginPath();c.arc(X(p),Y(q),4.5,0,7);c.fill();
   c.fillStyle=col('--inv');c.beginPath();c.arc(X(q),Y(p),4.5,0,7);c.fill()});
 }
}

function liveDraw(){const v=$('ans').value.trim();if(!v){S.attempt=null;draw();return}try{S.attempt=parse(v);draw()}catch(e){}}
/* UI */
NAMES.forEach((nm,i)=>{
 const b=document.createElement('button');b.className='lv';b.innerHTML=`<b>${i+1}</b>${nm}`;
 b.setAttribute('aria-pressed',i==0);
 b.onclick=()=>{S.lvl=i;[...$('levels').children].forEach((x,j)=>x.setAttribute('aria-pressed',j==i));newTask()};
 $('levels').appendChild(b)});
['√(','²','(',')','/','^'].forEach(k=>{
 const b=document.createElement('button');b.textContent=k;b.type='button';b.setAttribute('aria-label','Vložit '+k);
 b.onmousedown=e=>e.preventDefault();
 b.onclick=()=>{const e=$('ans');e.setRangeText(k,e.selectionStart,e.selectionEnd,'end');e.focus();liveDraw()};
 $('keys').appendChild(b)});
$('bCheck').onclick=check;$('bHint').onclick=hint;$('bShow').onclick=show;$('bNext').onclick=newTask;
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
$('ans').addEventListener('input',liveDraw);addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
newTask();score();
</script>
</body>
</html>
